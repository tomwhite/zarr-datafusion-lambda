[package]
name = "dispatcher-partial-reduce"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arrow = "58"
base64 = "0.22"
lambda_runtime = "1.0.1"
map-lambda-combiner = { git = "https://github.com/tomwhite/map-lambda", tag = "v0.3.1" }
map-lambda-dispatcher = { git = "https://github.com/tomwhite/map-lambda", tag = "v0.3.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
split = { path = "../split" }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
datafusion = "54.0.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
