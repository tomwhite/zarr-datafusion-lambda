# Named, not taken from the distribution, as a release builds the zips without
# installing this package.
project = "zarr-datafusion-lambda"
workspace = "../rust"
release_url = "https://github.com/tomwhite/zarr-datafusion-lambda/releases/download/v{version}"
# next to ERA5, which a query refuses to read from another region
region = "us-east-1"

[functions.fragment]
memory = 1769
timeout = 300

# for a fragment that writes its output, as the climatology does; ERA5 is read anonymously
[[functions.fragment.bucket_access]]
action = ["s3:PutObject", "s3:AbortMultipartUpload", "s3:GetObject", "s3:DeleteObject"]
resource = "arn:aws:s3:::{bucket}/*"

[[functions.fragment.bucket_access]]
action = ["s3:ListBucket"]
resource = "arn:aws:s3:::{bucket}"
